name: Update MuseAi Social build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and unpack new build
        run: |
          set -euo pipefail
          curl -fL -o /tmp/build.zip "https://muse.ai/files/1262794840260867/1133201166284665/phoyi1d0wx4fq04ncsz0dgfr/MuseAi-Social-Portable-BACKEND.zip"
          rm -rf /tmp/newbuild
          mkdir -p /tmp/newbuild
          unzip -q -o /tmp/build.zip -d /tmp/newbuild
          ls -R /tmp/newbuild | head -n 200
          test -d /tmp/newbuild/museai-social-portable/dist
          test -f /tmp/newbuild/museai-social-portable/dist/README.md
          test -f /tmp/newbuild/museai-social-portable/dist/index.html

      - name: Replace repo root with new build
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/newbuild/museai-social-portable/dist/. .
          test -f README.md
          test -f index.html
          ls -la

      - name: Commit new build
        run: |
          set -euo pipefail
          git config user.name "Git-FED"
          git config user.email "git-fed@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "MuseAi Social Space build for GitHub Pages" || echo "No changes to commit"
          git push origin main
