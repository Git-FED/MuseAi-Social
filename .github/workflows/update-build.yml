name: Update MuseAi Social build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and replace build
        run: |
          curl -L -o build.zip "https://muse.ai/files/1262794840260867/4912263529006810/px5vwuz0ppsvyupyh6i1gl2a/MuseAi-Social-Portable-BACKEND.zip"
          unzip -o build.zip
          ls -R museai-social-portable/dist
          find . -mindepth 1 ! -name '.git' -exec rm -rf {} +
          cp -r museai-social-portable/dist/. .
          rm -rf museai-social-portable build.zip
          test -f README.md
          ls -la
      - name: Commit build
        run: |
          git config user.name "Git-FED"
          git config user.email "git-fed@users.noreply.github.com"
          git add -A
          git status
          git commit -m "MuseAi Social Space build for GitHub Pages" || echo "No changes to commit"
          git push
