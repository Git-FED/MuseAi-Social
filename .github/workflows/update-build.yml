name: Update MuseAi Social build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and replace build
        run: |
          set -e
          curl -L -o /tmp/build.zip "https://muse.ai/files/1262794840260867/3662545897240486/z8f8mp49e46h5deagw1k33dh/MuseAi-Social-Portable-BACKEND.zip"
          rm -rf /tmp/newbuild && mkdir -p /tmp/newbuild
          unzip -o /tmp/build.zip -d /tmp/newbuild
          ls -la /tmp/newbuild/museai-social-portable/dist/
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/newbuild/museai-social-portable/dist/. .
          ls -la
          test -f README.md
      - name: Commit and push
        run: |
          git config user.name "Git-FED"
          git config user.email "git-fed@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "MuseAi Social Space build for GitHub Pages" || echo "No changes to commit"
          git push
