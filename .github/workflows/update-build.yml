name: Update MuseAi Social build
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and deploy build
        run: |
          set -e
          curl -L -o build.zip "https://muse.ai/files/1262794840260867/1679322480314372/dafq8ouvoz8pid0ijcfkdrsq/MuseAi-Social-Portable-BACKEND.zip"
          mkdir -p /tmp/newbuild
          unzip -o build.zip "museai-social-portable/dist/*" -d /tmp/extracted
          cp -r /tmp/extracted/museai-social-portable/dist/. /tmp/newbuild/
          test -f /tmp/newbuild/README.md
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/newbuild/. .
          curl -L -o MuseAi-Social.apk "https://muse.ai/files/1262794840260867/1497693099094202/k7087nq5hqergk9cnb2opjdl/MuseAi-Social.apk"
          ls -l MuseAi-Social.apk
          test -f MuseAi-Social.apk
          test $(stat -c%s MuseAi-Social.apk) -gt 20000000
          test -f README.md
          git config user.name "Git-FED"
          git config user.email "git-fed@users.noreply.github.com"
          git add -A
          git commit -m "MuseAi Social Space build for GitHub Pages" || echo "No changes to commit"
          git push
