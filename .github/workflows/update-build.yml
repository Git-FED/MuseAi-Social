name: Update MuseAi Social build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download and extract new build
        run: |
          set -e
          curl -fL -o /tmp/build.zip "https://muse.ai/files/1262794840260867/1147230087896675/474vc71km0nxmy2jzeoo6yg3/MuseAi-Social-Portable-BACKEND.zip"
          ls -l /tmp/build.zip
          unzip -l /tmp/build.zip | grep "museai-social-portable/dist/index.html"
          rm -rf /tmp/newbuild /tmp/newbuild-tmp
          mkdir -p /tmp/newbuild
          unzip -o /tmp/build.zip "museai-social-portable/dist/*" -d /tmp/newbuild-tmp
          cp -r /tmp/newbuild-tmp/museai-social-portable/dist/. /tmp/newbuild/
          test -f /tmp/newbuild/index.html
          test -f /tmp/newbuild/README.md
          echo "Build contents verified: museai-social-portable/dist/index.html and README.md present"
          ls -la /tmp/newbuild | head -40

      - name: Download APK
        run: |
          set -e
          curl -fL -o /tmp/MuseAi-Social.apk "https://muse.ai/files/1262794840260867/1497693099094202/k7087nq5hqergk9cnb2opjdl/MuseAi-Social.apk"
          ls -l /tmp/MuseAi-Social.apk
          APK_SIZE=$(stat -c%s /tmp/MuseAi-Social.apk)
          echo "APK size: $APK_SIZE bytes"
          test "$APK_SIZE" -eq 21563718

      - name: Replace repo contents with new build
        run: |
          set -e
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/newbuild/. .
          cp /tmp/MuseAi-Social.apk ./MuseAi-Social.apk
          test -f README.md
          test -f index.html
          test -f MuseAi-Social.apk
          ls -la

      - name: Commit and push
        run: |
          git config user.name "Git-FED"
          git config user.email "git-fed@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "MuseAi Social Space build for GitHub Pages" || echo "No changes to commit"
          git push
