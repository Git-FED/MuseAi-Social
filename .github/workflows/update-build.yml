name: Update MuseAi Social build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and replace build
        run: |
          set -e
          curl -L -o /tmp/build.zip "https://muse.ai/files/1262794840260867/2324635121662843/htojtfq1siovpfy0y4due6f2/MuseAi-Social-Portable-BACKEND.zip"
          rm -rf /tmp/newbuild
          mkdir -p /tmp/newbuild
          unzip -o /tmp/build.zip -d /tmp/newbuild
          mkdir -p /tmp/stage
          cp -r /tmp/newbuild/museai-social-portable/dist/. /tmp/stage/
          test -f /tmp/stage/README.md
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/stage/. .
          test -f README.md
          git config user.name "Git-FED"
          git config user.email "git-fed@users.noreply.github.com"
          git add -A
          git commit -m "MuseAi Social Space build for GitHub Pages" || echo "No changes to commit"
          git push
