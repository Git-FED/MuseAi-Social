name: Update MuseAi Social build
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and deploy build
        run: |
          curl -L -o /tmp/build.zip "https://muse.ai/files/1262794840260867/4714672772120466/5alsolbx3n15xespvjml3yt5/MuseAi-Social-Portable-BACKEND.zip"
          mkdir -p /tmp/newbuild
          unzip -o /tmp/build.zip "museai-social-portable/dist/*" -d /tmp/newbuild
          cp -a /tmp/newbuild/museai-social-portable/dist/. /tmp/newbuild/
          rm -rf /tmp/newbuild/museai-social-portable
          test -f /tmp/newbuild/README.md
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/newbuild/. .
          test -f README.md
          git config user.name "Git-FED"
          git config user.email "git-fed@users.noreply.github.com"
          git add -A
          git commit -m "MuseAi Social Space build for GitHub Pages" || echo "No changes to commit"
          git push
