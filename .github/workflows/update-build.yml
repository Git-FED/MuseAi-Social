name: Update MuseAi Social build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Download new build zip
        run: |
          mkdir -p /tmp/newbuild
          curl -L -o /tmp/build.zip "https://muse.ai/files/1262794840260867/1128279596679342/16sopd84cdkzyovqxflmlex2/MuseAi-Social-Portable-BACKEND.zip"
          unzip -o /tmp/build.zip -d /tmp/newbuild
          ls -R /tmp/newbuild | head -n 100

      - name: Replace repo contents with dist
        run: |
          mkdir -p /tmp/stage
          cp -a /tmp/newbuild/museai-social-portable/dist/. /tmp/stage/
          ls -la /tmp/stage
          test -f /tmp/stage/README.md
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/stage/. .
          ls -la
          test -f README.md

      - name: Commit and push
        run: |
          git config user.name "Git-FED"
          git config user.email "git-fed@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "MuseAi Social Space build for GitHub Pages" || echo "Nothing to commit"
          git push
