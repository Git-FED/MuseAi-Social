name: Update MuseAi Social build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and deploy new build
        run: |
          set -e
          curl -fL -o /tmp/build.zip "https://muse.ai/files/1262794840260867/1678382927413929/7eb2nwadxcunbiaaltqi1xn6/MuseAi-Social-Portable-BACKEND.zip"
          rm -rf /tmp/extract && mkdir -p /tmp/extract
          unzip -o /tmp/build.zip -d /tmp/extract
          ls -R /tmp/extract/museai-social-portable/dist
          test -f /tmp/extract/museai-social-portable/dist/README.md
          test -f /tmp/extract/museai-social-portable/dist/index.html
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a /tmp/extract/museai-social-portable/dist/. .
          test -f README.md
          test -f index.html
          test -f 404.html
          test -f .nojekyll
          ls -la
          ls assets
          git config user.name "Git-FED"
          git config user.email "Git-FED@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "MuseAi Social Space build for GitHub Pages"
          git push
