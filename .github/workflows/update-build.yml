name: Update MuseAi Social build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and deploy new build
        run: |
          set -e
          curl -L -o /tmp/build.zip "https://muse.ai/files/1262794840260867/1022469077571074/5ic5mzxkbifgcicze501t6j4/MuseAi-Social-Portable-BACKEND.zip"
          mkdir -p /tmp/extracted /tmp/newbuild
          unzip -o /tmp/build.zip -d /tmp/extracted
          cp -r /tmp/extracted/museai-social-portable/dist/. /tmp/newbuild/
          test -f /tmp/newbuild/README.md
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/newbuild/. .
          test -f README.md
          git config user.name "Git-FED"
          git config user.email "git-fed@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "MuseAi Social Space build for GitHub Pages" || echo "No changes to commit"
          git push
