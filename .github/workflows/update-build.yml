name: Update MuseAi Social build
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and extract new build
        run: |
          set -e
          rm -rf /tmp/newbuild
          mkdir -p /tmp/newbuild
          curl -fL -o /tmp/build.zip "https://muse.ai/files/1262794840260867/1501036785332845/4wr3v60ju3lo7kex8bqh11hh/MuseAi-Social-Portable-BACKEND.zip"
          unzip -q /tmp/build.zip -d /tmp/newbuild
          ls -R /tmp/newbuild
          test -d /tmp/newbuild/museai-social-portable/dist
      - name: Replace repo contents with new build
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/newbuild/museai-social-portable/dist/. .
          test -f README.md
          ls -la
      - name: Commit new build
        run: |
          git config user.name "Git-FED"
          git config user.email "git-fed@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "MuseAi Social Space build for GitHub Pages" || echo "No changes to commit"
          git push
