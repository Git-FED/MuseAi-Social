name: Restore missing featured cover

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-cover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore missing cover file
        run: |
          set -euo pipefail
          test -f assets/cover-money-mjwb3qs8.webp
          cp assets/cover-money-mjwb3qs8.webp assets/cover-money-tz8kbta8.webp
          test -f assets/cover-money-tz8kbta8.webp
          ls -la assets/cover-money-*.webp

      - name: Commit restored cover and remove this workflow
        run: |
          set -euo pipefail
          git config user.name "Git-FED"
          git config user.email "git-fed@users.noreply.github.com"
          git add assets/cover-money-tz8kbta8.webp
          git commit -m "Restore missing Making projects pay featured cover" || echo "No cover changes to commit"
          rm -rf .github
          git add -A
          git status --short
          git commit -m "Remove one-off fix-cover workflow" || echo "No workflow cleanup to commit"
          git push origin main
