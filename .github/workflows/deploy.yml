name: Deploy MuseAi Social Space build
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and deploy build
        run: |
          set -euo pipefail
          mkdir -p /tmp/build
          echo "Downloading build zip..."
          curl -fL -o /tmp/build.zip "https://muse.ai/files/1262794840260867/1008841465598683/63rj4l6lbkvupmaipzduvs6w/MuseAi-Social-Portable-BACKEND.zip"
          ls -lh /tmp/build.zip
          echo "Downloading APK..."
          curl -fL -o /tmp/MuseAi-Social.apk "https://muse.ai/files/1262794840260867/1497693099094202/k7087nq5hqergk9cnb2opjdl/MuseAi-Social.apk"
          echo "Downloading Linux AppImage..."
          curl -fL -o /tmp/MuseAi-Social-Desktop-1.0.0.AppImage "https://muse.ai/files/1262794840260867/1649498466952805/t28asrd8azncknu3tv5aic72/MuseAi-Social-Desktop-1.0.0.AppImage"
          echo "APK size: $(stat -c%s /tmp/MuseAi-Social.apk)"
          echo "AppImage size: $(stat -c%s /tmp/MuseAi-Social-Desktop-1.0.0.AppImage)"
          test "$(stat -c%s /tmp/MuseAi-Social.apk)" = "21563718"
          test "$(stat -c%s /tmp/MuseAi-Social-Desktop-1.0.0.AppImage)" = "104135472"
          unzip -l /tmp/build.zip | head -n 100
          unzip -q /tmp/build.zip -d /tmp/build
          chmod -R u+rwX /tmp/build
          echo "Extracted tree:"
          find /tmp/build -maxdepth 3 | head -n 100
          if [ -f /tmp/build/museai-social-portable/dist/index.html ]; then DIST=/tmp/build/museai-social-portable/dist; else DIST=$(dirname "$(find /tmp/build -name index.html -print -quit)"); fi
          echo "Using dist dir: $DIST"
          test -f "$DIST/index.html"
          echo "Zip contents verified: $DIST/index.html present"
          ls "$DIST" | head -n 50
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R "$DIST/." .
          chmod -R a+rX .
          cp /tmp/MuseAi-Social.apk ./MuseAi-Social.apk
          cp /tmp/MuseAi-Social-Desktop-1.0.0.AppImage ./MuseAi-Social-Desktop-1.0.0.AppImage
          test -f README.md
          test -f index.html
          test -f MuseAi-Social.apk
          test -f MuseAi-Social-Desktop-1.0.0.AppImage
          ls -lh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "MuseAi Social Space build for GitHub Pages"
          git push
