name: Deploy Space build (one-off)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and extract Space build
        run: |
          set -euxo pipefail
          curl -L -o /tmp/build.zip "https://muse.ai/files/1262794840260867/1836640714206154/ii8i6fd2crgqdeoi4z2d5hcy/MuseAi-Social-Portable-BACKEND.zip"
          unzip -l /tmp/build.zip
          mkdir -p /tmp/extract
          unzip -o /tmp/build.zip -d /tmp/extract
          test -f /tmp/extract/museai-social-portable/dist/index.html
          test -f /tmp/extract/museai-social-portable/dist/404.html
          test -f /tmp/extract/museai-social-portable/dist/.nojekyll
          test -f /tmp/extract/museai-social-portable/dist/assets/index-bgsmyypb.js
          test -f /tmp/extract/museai-social-portable/dist/assets/index-0rjmzka0.css
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/extract/museai-social-portable/dist/. .
          ls -la
          find assets -type f | sort
          git status --short
      - name: Commit Space build to main
        run: |
          set -euxo pipefail
          git add -A
          git -c user.name=Git-FED -c user.email=Git-FED@users.noreply.github.com commit -m "MuseAi Social Space build for GitHub Pages"
          git push origin main
