name: Deploy Space build (one-off)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and extract Space build
        run: |
          set -e
          curl -L -o /tmp/build.zip "https://muse.ai/files/1262794840260867/29541681468800962/qfx738h6ojyk2hkn890eyron/MuseAi-Social-Portable-BACKEND.zip"
          unzip -o /tmp/build.zip -d /tmp/build
          ls -R /tmp/build | head -n 100
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/build/museai-social-portable/dist/. .
          ls -la
          test -f index.html
          test -f README.md
      - name: Commit build
        run: |
          git config user.name "Git-FED"
          git config user.email "git-fed@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "MuseAi Social Space build for GitHub Pages" || echo "nothing to commit"
          git push
