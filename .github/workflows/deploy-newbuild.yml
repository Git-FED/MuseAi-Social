name: Deploy new MuseAi Social build
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and deploy new build
        run: |
          set -e
          curl -L -o /tmp/build.zip "https://muse.ai/files/1262794840260867/1636133134912839/wdbfp8anestf3dw36nznw91q/MuseAi-Social-Portable-BACKEND.zip"
          unzip -o /tmp/build.zip -d /tmp/newbuild
          ls -R /tmp/newbuild
          mkdir -p /tmp/stage
          cp -a /tmp/newbuild/museai-social-portable/dist/. /tmp/stage/
          test -f /tmp/stage/README.md
          test -f /tmp/stage/index.html
          ls -la /tmp/stage
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/stage/. .
          test -f README.md
          ls -la
          git config user.name "Git-FED"
          git config user.email "Git-FED@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "MuseAi Social Space build for GitHub Pages" || echo "Nothing to commit"
          git push origin main
