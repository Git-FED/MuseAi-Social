name: Build and deploy static site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build static HTML
        env:
          SITE_BASE_URL: https://${{ github.repository_owner }}.github.io
        run: |
          # GitHub Pages serves a user site (OWNER.github.io) at the domain
          # root and a project site (OWNER.github.io/REPO) under /REPO.
          # Derive the site base path from the repo name so links, assets,
          # sitemap, and robots all match where the site actually lives.
          # The site is flat: every page is one .html file in dist/.
          if [ "${{ github.event.repository.name }}" = "${{ github.repository_owner }}.github.io" ]; then
            export SITE_BASE_PATH=/
          else
            export SITE_BASE_PATH=/${{ github.event.repository.name }}
          fi
          npm run build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload generated site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
