    <meta name="color-scheme" content="light dark" />
    <!-- Empty inline icon: stops the browser fetching /favicon.ico, which
         lives outside the space's routes and fails auth. -->
    <link rel="icon" href="data:," />
    <title>MuseAi Social</title>
    <!-- Apply the visitor's saved theme before first paint so a reload
         never flashes the default theme. App.tsx owns the same key. -->
    <script>
      try {
        var savedTheme = localStorage.getItem("museai-social-theme");
        if (savedTheme && savedTheme !== "violet") {
          document.documentElement.setAttribute("data-theme", savedTheme);
        }
      } catch (e) {}
    </script>
